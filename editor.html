<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人主页编辑器</title>
  <style>
    :root {
      --accent: #0f766e;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #d4dce6;
      --soft: #fbfcfe;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #eef1f5;
      color: var(--text);
      font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.55;
    }
    .topbar {
      position: sticky; top: 0; z-index: 20;
      background: #ffffff; border-bottom: 1px solid var(--border);
      padding: 14px 22px;
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; flex-wrap: wrap;
    }
    .topbar h1 { font-size: 1.15rem; margin: 0; letter-spacing: -0.2px; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; }
    button {
      font: inherit; cursor: pointer; border-radius: 9px;
      padding: 9px 14px; border: 1px solid var(--border); background: #fff;
      color: var(--text); transition: background 0.15s, border-color 0.15s;
    }
    button:hover { border-color: var(--accent); }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button.primary:hover { background: #0b5f57; }
    button.ghost { padding: 5px 10px; font-size: 0.82rem; }
    button.danger { color: #c0392b; }
    button.add { width: 100%; border-style: dashed; color: var(--accent); background: var(--soft); font-weight: 600; }
    .wrap { max-width: 880px; margin: 0 auto; padding: 24px 18px 90px; }
    .panel { background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 18px 20px; margin-bottom: 18px; }
    .panel h2 { margin: 0 0 14px; font-size: 1.05rem; }
    label { display: block; margin-bottom: 12px; font-size: 0.88rem; color: #34404d; font-weight: 600; }
    .sub-label { font-size: 0.88rem; color: #34404d; font-weight: 600; margin-bottom: 8px; }
    input, textarea, select {
      width: 100%; box-sizing: border-box; margin-top: 5px;
      padding: 9px 11px; border: 1px solid var(--border); border-radius: 8px;
      font: inherit; font-weight: 400; color: var(--text); background: #fff;
    }
    textarea { resize: vertical; }
    input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.12); }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; column-gap: 14px; }
    .repeat-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 10px; }
    .repeat-item { border: 1px dashed var(--border); border-radius: 10px; padding: 12px 14px; background: var(--soft); }
    .repeat-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .num { color: #8a97a5; font-size: 0.8rem; font-weight: 700; }
    .hint { color: var(--muted); font-size: 0.78rem; font-weight: 400; margin-top: 4px; }
    .toast {
      position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(20px);
      background: #1c2733; color: #fff; padding: 10px 18px; border-radius: 999px;
      opacity: 0; pointer-events: none; transition: all 0.25s ease; font-size: 0.9rem;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.error { background: #c0392b; }
    @media (max-width: 640px) { .grid2 { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="topbar">
    <h1>个人主页编辑器</h1>
    <div class="actions">
      <button type="button" onclick="preview()">预览主页</button>
      <button type="button" class="primary" onclick="save()">保存并生成</button>
    </div>
  </div>

  <div class="wrap" id="app"></div>
  <div class="toast" id="toast"></div>

  <script>
    let state = {
      name: "", roles: [], photo: "", email: "", github: "", website: "", about: "",
      news: [], research: [], aims: [], timeline: [], publications: [], awards: [],
      life_title: "", life_text: ""
    };

    const $ = id => document.getElementById(id);

    function escAttr(v) {
      return String(v ?? "").replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
    function escText(v) {
      return String(v ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
    function toLines(arr) { return Array.isArray(arr) ? arr.join("\n") : ""; }
    function fromLines(text) { return String(text ?? "").split("\n").map(s => s.trim()).filter(Boolean); }
    function toParagraphs(arr) { return Array.isArray(arr) ? arr.join("\n\n") : ""; }
    function fromParagraphs(text) { return String(text ?? "").split(/\n\s*\n/).map(s => s.trim()).filter(Boolean); }
    function section(title, inner) { return `<section class="panel"><h2>${escText(title)}</h2>${inner}</section>`; }

    function render() {
      const d = state;
      let html = "";

      let roles = '<div class="repeat-list">';
      d.roles.forEach((r, i) => {
        roles += `<div class="repeat-item"><div class="repeat-head"><span class="num">#${i + 1}</span><button type="button" class="ghost danger" onclick="removeAt('roles', ${i})">删除</button></div><label>身份 / 头衔<input id="role_${i}" value="${escAttr(r)}"></label></div>`;
      });
      roles += '</div><button type="button" class="add" onclick="addRole()">+ 添加身份 / 头衔</button>';

      html += section("基本信息", `
        <div class="grid2">
          <label>姓名<input id="f_name" value="${escAttr(d.name)}"></label>
          <label>邮箱<input id="f_email" value="${escAttr(d.email)}"></label>
          <label>GitHub 链接<input id="f_github" value="${escAttr(d.github)}" placeholder="https://github.com/..."></label>
          <label>个人主页链接<input id="f_website" value="${escAttr(d.website)}" placeholder="https://..."></label>
        </div>
        <label>照片文件名（可选，放在同目录）<input id="f_photo" value="${escAttr(d.photo)}" placeholder="例如 photo.jpg"></label>
        <div class="sub-label">身份 / 头衔</div>${roles}
        <label>关于我<textarea id="f_about" rows="4">${escText(d.about)}</textarea></label>
      `);

      html += section("News", `<label>每行一条动态<textarea id="f_news" rows="3">${escText(toLines(d.news))}</textarea></label>`);

      let research = '<div class="repeat-list">';
      d.research.forEach((r, i) => {
        research += `
          <div class="repeat-item">
            <div class="repeat-head"><span class="num">#${i + 1}</span><button type="button" class="ghost danger" onclick="removeAt('research', ${i})">删除</button></div>
            <label>标签（Tag）<input id="research_${i}_tag" value="${escAttr(r.tag)}"></label>
            <label>标题<input id="research_${i}_title" value="${escAttr(r.title)}"></label>
            <label>正文段落<textarea id="research_${i}_paragraphs" rows="5">${escText(toParagraphs(r.paragraphs))}</textarea><div class="hint">段落之间用空行分隔</div></label>
          </div>`;
      });
      research += '</div><button type="button" class="add" onclick="addResearch()">+ 添加研究主题</button>';
      html += section("Research", research);

      let aims = '<div class="repeat-list">';
      d.aims.forEach((a, i) => {
        aims += `
          <div class="repeat-item">
            <div class="repeat-head"><span class="num">#${i + 1}</span><button type="button" class="ghost danger" onclick="removeAt('aims', ${i})">删除</button></div>
            <label>标题<input id="aim_${i}_title" value="${escAttr(a.title)}"></label>
            <label>内容<textarea id="aim_${i}_text" rows="2">${escText(a.text)}</textarea></label>
          </div>`;
      });
      aims += '</div><button type="button" class="add" onclick="addAim()">+ 添加方向</button>';
      html += section("What I Care About", aims);

      let timeline = '<div class="repeat-list">';
      d.timeline.forEach((t, i) => {
        const eduSel = t.type === "Education" ? "selected" : "";
        const expSel = t.type === "Experience" ? "selected" : "";
        timeline += `
          <div class="repeat-item">
            <div class="repeat-head"><span class="num">#${i + 1}</span><button type="button" class="ghost danger" onclick="removeAt('timeline', ${i})">删除</button></div>
            <div class="grid2">
              <label>日期<input id="tl_${i}_date" value="${escAttr(t.date)}" placeholder="例如 09/2026 – 06/2027"></label>
              <label>类型<select id="tl_${i}_type"><option value="Education" ${eduSel}>Education</option><option value="Experience" ${expSel}>Experience</option></select></label>
            </div>
            <label>标题<input id="tl_${i}_title" value="${escAttr(t.title)}"></label>
            <label>学校 / 机构<input id="tl_${i}_sub" value="${escAttr(t.sub)}"></label>
            <label>说明<textarea id="tl_${i}_desc" rows="2">${escText(t.desc)}</textarea></label>
          </div>`;
      });
      timeline += '</div><button type="button" class="add" onclick="addTimeline()">+ 添加时间线</button>';
      html += section("Timeline", timeline);

      html += section("Publications", `<label>每行一篇<textarea id="f_publications" rows="2">${escText(toLines(d.publications))}</textarea></label>`);
      html += section("Awards", `<label>每行一个奖项<textarea id="f_awards" rows="3">${escText(toLines(d.awards))}</textarea></label>`);
      html += section("Beyond Research", `
        <label>标题<input id="f_life_title" value="${escAttr(d.life_title)}"></label>
        <label>内容<textarea id="f_life_text" rows="5">${escText(d.life_text)}</textarea></label>
      `);

      $("app").innerHTML = html;
    }

    function collect() {
      if (!state) return;
      const val = id => $(id) ? $(id).value : "";
      state.name = val("f_name");
      state.email = val("f_email");
      state.github = val("f_github").trim();
      state.website = val("f_website").trim();
      state.photo = val("f_photo").trim();
      state.about = val("f_about");
      state.news = fromLines(val("f_news"));
      state.publications = fromLines(val("f_publications"));
      state.awards = fromLines(val("f_awards"));
      state.life_title = val("f_life_title");
      state.life_text = val("f_life_text");

      state.roles.forEach((_, i) => { state.roles[i] = val(`role_${i}`); });
      state.research.forEach((r, i) => {
        r.tag = val(`research_${i}_tag`);
        r.title = val(`research_${i}_title`);
        r.paragraphs = fromParagraphs(val(`research_${i}_paragraphs`));
      });
      state.aims.forEach((a, i) => {
        a.title = val(`aim_${i}_title`);
        a.text = val(`aim_${i}_text`);
      });
      state.timeline.forEach((t, i) => {
        t.date = val(`tl_${i}_date`);
        t.type = val(`tl_${i}_type`);
        t.title = val(`tl_${i}_title`);
        t.sub = val(`tl_${i}_sub`);
        t.desc = val(`tl_${i}_desc`);
      });
    }

    function addRole() { collect(); state.roles.push(""); render(); }
    function addResearch() { collect(); state.research.push({ tag: "", title: "", paragraphs: [] }); render(); }
    function addAim() { collect(); state.aims.push({ title: "", text: "" }); render(); }
    function addTimeline() { collect(); state.timeline.push({ date: "", type: "Education", title: "", sub: "", desc: "" }); render(); }
    function removeAt(type, index) { collect(); state[type].splice(index, 1); render(); }

    async function save() {
      collect();
      try {
        const res = await fetch("/api/data", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(state) });
        const obj = await res.json();
        if (obj.ok) { toast("已保存，主页已重新生成"); return true; }
        toast("保存失败：" + (obj.error || res.status), true);
        return false;
      } catch (e) { toast("保存失败：" + e.message, true); return false; }
    }

    async function preview() {
      const ok = await save();
      if (ok) window.open("/index.html?t=" + Date.now(), "_blank");
    }

    function toast(msg, isError = false) {
      const el = $("toast");
      el.textContent = msg;
      el.className = "toast show" + (isError ? " error" : "");
      clearTimeout(el._timer);
      el._timer = setTimeout(() => { el.className = "toast"; }, 2500);
    }

    document.addEventListener("keydown", e => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") { e.preventDefault(); save(); }
    });

    async function load() {
      const res = await fetch("/api/data");
      state = await res.json();
      render();
    }

    load();
  </script>
</body>
</html>
